name: HoverCard original full-suite diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Each call gets a fresh runner, checkout, and Vitest result cache. These are
# bounded full-suite observations, never retries of a target/capture failure.
jobs:
  observe-1:
    uses: ./.github/workflows/hover-card-observation.yml
    with:
      observation: 1

  observe-2:
    needs: observe-1
    if: ${{ !cancelled() && needs.observe-1.outputs.continue == 'true' }}
    uses: ./.github/workflows/hover-card-observation.yml
    with:
      observation: 2
      prior-suites-passed: ${{ needs.observe-1.outputs.all-suites-passed == 'true' }}

  observe-3:
    needs: observe-2
    if: ${{ !cancelled() && needs.observe-2.outputs.continue == 'true' }}
    uses: ./.github/workflows/hover-card-observation.yml
    with:
      observation: 3
      prior-suites-passed: ${{ needs.observe-2.outputs.all-suites-passed == 'true' }}
