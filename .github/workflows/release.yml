name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org/
      - name: Verify publish scope offline
        run: |
          node --test scripts/test-publish.mjs
          node scripts/publish-packages.mjs --check

      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Install smoke browsers
        run: pnpm playwright install --with-deps chromium firefox webkit

      - name: Verify release
        run: |
          pnpm run lint
          pnpm run test:ci
          pnpm run test:browser-smoke
          pnpm --filter @destyler-ui/react check
          PACKED_BROWSER=1 pnpm --filter @destyler-ui/react check:package
          pnpm --filter @destyler-ui/vue check
          PACKED_BROWSER=1 pnpm exec node scripts/test-vue-package.mjs
          pnpm --filter @destyler-ui/svelte check:ci
          PACKED_BROWSER=1 pnpm exec node scripts/test-svelte-package.mjs
          pnpm --filter @destyler-ui/solid check
          PACKED_BROWSER=1 pnpm exec node scripts/test-solid-package.mjs
          pnpm --filter @destyler-ui/react build-storybook
          pnpm --filter @destyler-ui/vue build-storybook
          pnpm --filter @destyler-ui/svelte build-storybook
          pnpm --filter @destyler-ui/solid build-storybook
          pnpm run docs:build
          pnpm run test:core-compat test/core-compat

      - name: Upload exact-core consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-compat-consumers
          path: |
            test/core-compat/results.json
            test/core-compat/*/package.json
            test/core-compat/*/package-lock.json
            test/core-compat/*/versions.json
            test/core-compat/*/*.log
          if-no-files-found: ignore
          retention-days: 14

      - run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Publish to NPM
        run: pnpm run publish:ci
