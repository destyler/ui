name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Install smoke browsers
        run: pnpm playwright install --with-deps chromium firefox webkit

      - name: Verify release
        run: |
          pnpm run lint
          pnpm run test:ci
          pnpm run test:browser-smoke
          pnpm --filter @destyler-ui/react check
          PACKED_BROWSER=1 pnpm --filter @destyler-ui/react check:package
          pnpm --filter @destyler-ui/vue check
          PACKED_BROWSER=1 pnpm exec node scripts/test-vue-package.mjs
          pnpm --filter @destyler-ui/svelte check:ci
          PACKED_BROWSER=1 pnpm exec node scripts/test-svelte-package.mjs
          pnpm --filter @destyler-ui/solid check
          PACKED_BROWSER=1 pnpm exec node scripts/test-solid-package.mjs
          pnpm --filter @destyler-ui/react build-storybook
          pnpm --filter @destyler-ui/vue build-storybook
          pnpm --filter @destyler-ui/svelte build-storybook
          pnpm --filter @destyler-ui/solid build-storybook
          pnpm run docs:build

      - run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Upgrade npm
        run: npm i -g npm@latest

      - name: Publish to NPM
        run: pnpm run publish:ci
