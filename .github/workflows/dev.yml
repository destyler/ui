name: CI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Dev Page
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Document
        run: pnpm run docs:build

      - name: Zip dev.destyler.org
        run: pnpm exec tsx scripts/zip.ts docs/dist docs-dist

      - name: Deploy dev.destyler.org
        run: pnpm exec tsx scripts/deploy.ts ${TOKEN} ${ENV} ${SERVICE} docs-dist.zip
        env:
          TOKEN: ${{secrets.ZEABUR_TOKEN}}
          ENV: ${{secrets.DEV_UI_DESTYLER_ENV}}
          SERVICE: ${{secrets.DEV_UI_DESTYLER_ORG}}
