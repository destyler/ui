name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - fix/svelte-tree-branch-trigger

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.specstory/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify React lint configuration
        run: node scripts/test-eslint-react-config.mjs

      - name: Verify Solid lint configuration
        run: node scripts/test-eslint-solid-config.mjs

      - name: Verify Astro lint and client contracts
        run: node --test scripts/test-astro-eslint-config.mjs scripts/test-astro-docs-behavior.mjs

      - name: Lint
        run: pnpm run lint
